notes: >-
  Teller Protocol is a decentralized (DeFi) lending/borrowing protocol on
  Ethereum and other EVM chains (Base, Arbitrum, Polygon, BNB). Its integration
  surface is smart contracts + a GraphQL subgraph rather than a hosted REST API.
  The one first-party client package published to a public registry is the
  embeddable Teller (Cash Advance) Widget on npm.
