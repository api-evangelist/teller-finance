name: Teller Finance
description: >-
  Teller Finance (Teller Protocol) is a decentralized, multi-chain lending and
  borrowing protocol on Ethereum, Base, Arbitrum, Polygon, and BNB Chain.
  Borrowers take fixed-APR, time-based loans from isolated lending pools using
  their tokens as collateral, with no oracle-driven margin-call liquidations,
  through an open order-book of markets governed by the TellerV2 smart contract.
  The developer surface is on-chain (Solidity smart contracts) plus a GraphQL
  subgraph for read-side data and an embeddable Cash Advance widget (npm) that
  any dapp can drop into its front end - there is no hosted REST API, OAuth
  server, or API-key program; authentication is wallet-based. Teller was
  surfaced as a portfolio company of Bessemer Venture Partners and enriched here
  from its public developer surface.
